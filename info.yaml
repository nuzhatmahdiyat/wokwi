  ui[5]: "B2"     # MSB of B
  ui[6]: ""
  ui[7]: ""

  uo[0]: "GT"     # A > B
  uo[1]: "EQ"     # A = B
  uo[2]: "LT"     # A < B
  uo[3]: "ANC1"  
  uo[4]: "ANC2"   
